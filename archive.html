<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Paper Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003657; --navy-deep:#002841; --cardinal:#d22d40;
  --bg:#ffffff; --surface:#ffffff; --text:#1a1a1a; --muted:#5c5c5c;
  --border:#e4e4e4; --band-text:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06);
}
/* Light by default, deliberately: the digest is read in the morning and on
   a hosted page where the viewer's OS theme is not a useful signal. Dark is
   still available, but only when explicitly selected. */
:root[data-theme="dark"]{
  --navy:#7fb0d4; --navy-deep:#0d1b26; --cardinal:#e8697a;
  --bg:#11151a; --surface:#181d24; --text:#e9e6e2; --muted:#9aa4ae;
  --border:#2a323b; --band-text:#eaf2f8; --shadow:none;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"EB Garamond",Garamond,"Adobe Garamond Pro","Palatino Linotype",
              Palatino,Georgia,serif;
  font-size:18px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px; margin:0 auto; padding:0 20px 64px}
header.masthead{
  background:var(--navy-deep); color:var(--band-text);
  padding:34px 20px 28px; margin-bottom:34px;
  border-bottom:4px solid var(--cardinal);
}
.masthead-inner{max-width:820px; margin:0 auto}
h1{
  margin:0 0 6px; font-size:2.1rem; font-weight:600; letter-spacing:.01em;
  color:var(--band-text);
}
.dateline{margin:0; font-size:1rem; color:var(--band-text); opacity:.85}
.counts{margin:14px 0 0; font-size:.9rem; color:var(--band-text); opacity:.8}
details.sources{margin-top:12px; font-size:.85rem; color:var(--band-text)}
details.sources summary{cursor:pointer; opacity:.85}
details.sources .list{
  margin-top:8px; opacity:.8; line-height:1.7; word-break:break-word;
}
h2.thread{
  font-size:1.28rem; font-weight:600; margin:38px 0 4px; color:var(--navy);
  padding-bottom:7px; border-bottom:2px solid var(--navy);
}
.thread-count{font-size:.82rem; color:var(--muted); margin:0 0 16px}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-left:3px solid var(--cardinal); border-radius:3px;
  padding:15px 18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card h3{margin:0 0 5px; font-size:1.08rem; font-weight:600; line-height:1.35}
.card h3 a{color:var(--text); text-decoration:none;
  border-bottom:1px solid transparent}
.card h3 a:hover{color:var(--cardinal); border-bottom-color:var(--cardinal)}
.meta{margin:0 0 9px; font-size:.86rem; color:var(--muted)}
.badge{
  display:inline-block; background:var(--cardinal); color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:.7rem; font-weight:600; letter-spacing:.03em;
  padding:2px 7px; border-radius:2px;
  margin-right:8px; vertical-align:1px; white-space:nowrap;
}
.meta .series{color:var(--navy); font-style:italic}
.kw{margin:0 0 8px; display:flex; flex-wrap:wrap; gap:5px}
.kw span{
  display:inline-block; border:1px solid var(--navy); color:var(--navy);
  background:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:.64rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  padding:1px 6px; border-radius:9px; white-space:nowrap;
}
.card.flagged{border-left-width:5px}
.alarm{
  background:var(--cardinal); color:#fff; padding:12px 16px; border-radius:3px;
  margin:14px 0 0; font-size:.92rem;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.alarm strong{font-weight:700}
.note{margin:0; font-size:.95rem}
.note::before{
  content:"Why it matters "; color:var(--cardinal); font-weight:600;
  font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.empty{
  color:var(--muted); font-style:italic; margin:0 0 8px; padding:10px 0;
  font-size:.95rem;
}
/* Browse section: everything fetched that did not earn a written note. */
.browse{margin-top:46px; border-top:2px solid var(--navy); padding-top:8px}
.browse > summary{
  cursor:pointer; font-size:1.28rem; font-weight:600; color:var(--navy);
  padding:8px 0; list-style:none;
}
.browse > summary::-webkit-details-marker{display:none}
.browse > summary::before{content:"\25B8 "; font-size:.9em}
.browse[open] > summary::before{content:"\25BE "}
.browse .hint{font-size:.85rem; color:var(--muted); margin:2px 0 14px}
.filters{
  display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:16px;
}
.filters input{
  font-family:inherit; font-size:.92rem; padding:6px 10px; flex:1 1 190px;
  border:1px solid var(--border); border-radius:3px;
  background:var(--surface); color:var(--text);
}
.chip{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.7rem;
  font-weight:600; letter-spacing:.03em; padding:4px 9px; border-radius:11px;
  border:1px solid var(--border); background:transparent; color:var(--muted);
  cursor:pointer; white-space:nowrap;
}
.chip[aria-pressed="true"]{
  background:var(--navy); border-color:var(--navy); color:#fff;
}
ul.rows{list-style:none; margin:0; padding:0}
ul.rows li{
  padding:9px 0; border-bottom:1px solid var(--border); font-size:.95rem;
}
ul.rows li a{color:var(--text); text-decoration:none}
ul.rows li a:hover{color:var(--cardinal)}
ul.rows .who{display:block; font-size:.82rem; color:var(--muted); margin-top:2px}
ul.rows .src{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.66rem;
  font-weight:600; color:var(--cardinal); margin-right:7px;
  text-transform:none; white-space:nowrap;
}
.nomatch{color:var(--muted); font-style:italic; padding:14px 0}
footer{
  margin-top:52px; padding-top:18px; border-top:1px solid var(--border);
  font-size:.85rem; color:var(--muted);
}
footer h4{
  margin:0 0 8px; font-size:.72rem; letter-spacing:.07em;
  text-transform:uppercase; color:var(--cardinal);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
footer ul{margin:0 0 16px; padding-left:20px}
footer li{margin-bottom:5px; word-break:break-word}
footer .ok{color:var(--muted)}
@media (max-width:600px){
  body{font-size:17px}
  header.masthead{padding:26px 18px 22px}
  h1{font-size:1.6rem}
  .wrap{padding:0 16px 48px}
}

.tools{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:14px 0 12px; border-bottom:1px solid var(--border); margin-bottom:6px;
}
.tools .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.tools input, .tools select{
  font-family:inherit; font-size:.94rem; padding:7px 10px;
  border:1px solid var(--border); border-radius:3px;
  background:var(--surface); color:var(--text);
}
.tools input[type=search]{flex:1 1 240px}
.tools select{flex:0 1 auto; max-width:100%}
.tools .stat{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.82rem;
  color:var(--muted); margin-top:9px;
}
.tools button.reset{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.78rem;
  padding:6px 11px; border-radius:3px; border:1px solid var(--border);
  background:transparent; color:var(--muted); cursor:pointer;
}
.tools button.reset:hover{color:var(--cardinal); border-color:var(--cardinal)}
ul.papers{list-style:none; margin:0; padding:0}
ul.papers li{padding:13px 0; border-bottom:1px solid var(--border)}
ul.papers .t{font-size:1.02rem; font-weight:600; line-height:1.35}
ul.papers .t a{color:var(--text); text-decoration:none}
ul.papers .t a:hover{color:var(--cardinal)}
ul.papers .m{
  font-size:.82rem; color:var(--muted); margin-top:3px;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
ul.papers .m .lab{color:var(--cardinal); font-weight:600}
ul.papers .m .ser{color:var(--navy)}
ul.papers .th{
  display:inline-block; border:1px solid var(--navy); color:var(--navy);
  border-radius:9px; padding:0 7px; margin-left:8px; font-size:.68rem;
  font-weight:600; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  vertical-align:2px; white-space:nowrap;
}
.more{
  display:block; width:100%; margin:22px 0; padding:11px; cursor:pointer;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:.88rem;
  border:1px solid var(--navy); border-radius:3px; background:transparent;
  color:var(--navy); font-weight:600;
}
.more:hover{background:var(--navy); color:#fff}
</style>
</head>

<script>
(function(){
  var DATA = window.__CORPUS__ || [];
  var PAGE = 100, shown = PAGE;
  var q      = document.getElementById('q');
  var fSrc   = document.getElementById('f-source');
  var fSer   = document.getElementById('f-series');
  var fTh    = document.getElementById('f-thread');
  var fJel   = document.getElementById('f-jel');
  var fYear  = document.getElementById('f-year');
  var list   = document.getElementById('papers');
  var stat   = document.getElementById('stat');
  var more   = document.getElementById('more');
  var reset  = document.getElementById('reset');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function matches(r){
    var t = (q.value || '').trim().toLowerCase();
    if (t && r._s.indexOf(t) === -1) return false;
    if (fSrc.value && r.source_label !== fSrc.value) return false;
    if (fSer.value && r.series !== fSer.value) return false;
    if (fTh.value  && (r.thread || '') !== fTh.value) return false;
    if (fJel.value && !(r.jel || []).some(function(j){
      return j.charAt(0) === fJel.value; })) return false;
    if (fYear.value && String(r.date || '').indexOf(fYear.value) === -1) return false;
    return true;
  }

  function row(r){
    var who = (r.authors || []).join(', ');
    var bits = [];
    if (r.source_label) bits.push('<span class="lab">' + esc(r.source_label) + '</span>');
    if (r.series) {
      var shortSer = r.series.split(',')[0].trim();
      bits.push('<span class="ser" title="' + esc(r.series) + '">'
                + esc(shortSer) + '</span>');
    }
    if (who) bits.push(esc(who));
    if (r.date) bits.push(esc(r.date));
    if ((r.jel || []).length) bits.push('JEL ' + esc(r.jel.join(' ')));
    var th = r.thread ? '<span class="th">' + esc(r.thread.replace(/_/g,' ')) + '</span>' : '';
    return '<li><div class="t"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">'
         + esc(r.title) + '</a>' + th + '</div>'
         + '<div class="m">' + bits.join(' &middot; ') + '</div></li>';
  }

  function render(){
    var hits = DATA.filter(matches);
    var page = hits.slice(0, shown);
    list.innerHTML = page.length
      ? page.map(row).join('')
      : '<li class="nomatch">Nothing matches those filters.</li>';
    stat.textContent = hits.length
      ? ('Showing ' + page.length + ' of ' + hits.length + ' papers'
         + (hits.length === DATA.length ? '' : ' (' + DATA.length + ' collected)'))
      : 'No matches';
    more.style.display = hits.length > shown ? '' : 'none';
    more.textContent = 'Show ' + Math.min(PAGE, hits.length - shown) + ' more';
  }

  function reflow(){ shown = PAGE; render(); }

  [q, fSrc, fSer, fTh, fJel, fYear].forEach(function(el){
    el.addEventListener('input', reflow);
    el.addEventListener('change', reflow);
  });
  more.addEventListener('click', function(){ shown += PAGE; render(); });
  reset.addEventListener('click', function(){
    q.value = ''; fSrc.value = ''; fSer.value = '';
    fTh.value = ''; fJel.value = ''; fYear.value = '';
    reflow();
  });

  render();
})();
</script>
